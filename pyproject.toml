[build-system]
# The backend is in the repo (_build/backend.py): building it needs nothing from PyPI.
requires = []
build-backend = "backend"
backend-path = ["_build"]

[project]
name = "lightweight-metrics"
version = "0.1.0"
description = "A Prometheus /metrics and /healthz endpoint in pure Python, with no dependencies"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.urls]
Source = "https://github.com/zindello/lightweight-metrics"
